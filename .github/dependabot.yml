# Keeps the pinned GitHub Actions majors, the pnpm workspace and the Flutter app's pub packages current.
# Updates arrive as pull requests that run the normal CI; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directories:
      - /
      - /apps/api
      - /apps/ai
      - /packages/contracts
      - /packages/device-specs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-tooling:
        patterns: [typescript, typescript-eslint, eslint, vitest, "@types/*"]

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
