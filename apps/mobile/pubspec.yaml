name: wattbyte
description: "WattByte - see how much data and energy your phone uses."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned transitively by flutter_localizations.
  intl: 0.20.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  share_plus: ^10.0.2
  workmanager: ^0.10.0
  home_widget: ^0.7.0
  flutter_local_notifications: ^17.2.2
  # Used by the OpenAPI-generated client in lib/generated/api.
  http: ^1.2.2
  wattbyte_system:
    path: packages/wattbyte_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # In-memory SQLite for database and sync tests on the host (needs libsqlite3, present on macOS and ubuntu runners).
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/device_specs/devices.json
