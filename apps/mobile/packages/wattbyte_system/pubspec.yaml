name: wattbyte_system
description: "WattByte platform bridge: official Android/iOS system APIs only."
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: pl.wattbyte.system
        pluginClass: WattByteSystemPlugin
      ios:
        pluginClass: WattByteSystemPlugin
