packages:
  - apps/api
  - apps/ai
  - apps/web
  - packages/contracts
  - packages/device-specs
# apps/mobile is a Flutter project and is not part of the pnpm workspace.

# esbuild's postinstall only validates its platform binary; allow it so vitest/tsx work.
allowBuilds:
  esbuild: true
  # workerd (Cloudflare Workers runtime used by wrangler dev/preview in apps/web) only validates its platform binary.
  workerd: true
  # eslint-config-next's resolver ships prebuilt binaries; its postinstall is only a fallback.
  unrs-resolver: false

# Transitive fast-uri (through fastify's ajv-compiler and @fastify/swagger's json-schema-resolver) below these versions has four
# advisories (URI scheme spoofing, host confusion, path equivalence, scheme injection). The 3.x and 4.x lines both got fixes.
overrides:
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "^4.2.3"
  # Found when apps/web joined the lockfile (2026-10-30): transitive packages of openai (undici) and of the OpenNext deploy
  # tooling (body-parser). Patch-level raises within the same major line.
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  # glob (GHSA-3g3m-2fjr-6pw4, 9.0.0 to 14.0.1) and minimatch (GHSA-g3hv-75wg-m249, every version below 11.0.1) were published on
  # 2026-10-30; no older line got a patch, and the newest eslint, typescript-eslint and @opennextjs/cloudflare still ask for the old
  # ones (checked 2026-10-31), so this is a major raise. Reached through ESLint and the OpenNext deploy tooling only. minimatch 11
  # exports a named function: a rule of eslint-plugin-react, -import or -jsx-a11y that still calls `minimatch(...)` the version 3
  # way would throw. None of the rules enabled here does (lint covers it). Remove both lines once those packages depend on
  # minimatch >= 11 and glob >= 14.0.2 themselves.
  "glob@>=9.0.0 <14.0.2": "^14.0.2"
  "minimatch@<11.0.1": "^11.0.1"

auditConfig:
  ignoreGhsas:
    # zod "memory exhaustion when validating oversized arrays" (fixed in zod 4.6.6). The flaw is in the zod 4 core ($ZodArray) that
    # the zod 3.25 package also ships under `zod/v4`. This repository imports `zod` (the v3 API) only; the single importer of
    # `zod/v4` is openai's optional `openai/helpers/zod`, which nothing here uses, and request bodies are capped at 16 KiB.
    # The real fix is the zod 3 -> 4 migration (fastify-type-provider-zod, contracts, ai, api). Remove this entry when that lands.
    - GHSA-mrhx-c7xc-m3w5
