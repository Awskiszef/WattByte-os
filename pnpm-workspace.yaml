packages:
  - apps/api
  - apps/ai
  - apps/web
  - packages/contracts
  - packages/device-specs
# apps/mobile is a Flutter project and is not part of the pnpm workspace.

# esbuild's postinstall only validates its platform binary; allow it so vitest/tsx work.
allowBuilds:
  esbuild: true
  # workerd (Cloudflare Workers runtime used by wrangler dev/preview in apps/web) only validates its platform binary.
  workerd: true
  # eslint-config-next's resolver ships prebuilt binaries; its postinstall is only a fallback.
  unrs-resolver: false
